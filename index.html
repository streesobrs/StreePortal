<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面汇总导航</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        accent: '#8B5CF6',
                        dark: '#1F2937',
                        light: '#F3F4F6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-hover {
                @apply transition-all duration-300 hover:shadow-xl hover:-translate-y-1;
            }
            .fade-in {
                animation: fadeIn 0.5s ease-in-out;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen">
    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm py-4">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-dark">页面汇总</h1>
                <button id="refresh-btn" class="p-2 rounded-full bg-gray-100 hover:bg-gray-200 transition-colors">
                    <i class="fa fa-refresh text-gray-600"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-10">
        <!-- 页面介绍 -->
        <div class="text-center mb-12 fade-in">
            <h2 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-dark mb-4">快速访问各页面</h2>
            <p class="text-gray-600 max-w-2xl mx-auto">点击下方卡片跳转到相应页面，所有页面均可在GitHub Pages上完美运行</p>
        </div>

        <!-- 页面卡片容器 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="pages-container">
            <!-- 页面卡片会通过JavaScript动态生成 -->
        </div>
    </main>

    <!-- 添加新页面按钮 -->
    <div class="fixed bottom-6 right-6">
        <button id="add-page-btn" class="w-14 h-14 bg-primary text-white rounded-full shadow-lg flex items-center justify-center hover:bg-primary/90 transition-all transform hover:scale-110">
            <i class="fa fa-plus text-xl"></i>
        </button>
    </div>

    <!-- 页脚 -->
    <footer class="bg-dark text-gray-400 py-6 mt-16">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2023 页面汇总导航 | 适合部署在GitHub Pages</p>
        </div>
    </footer>

    <!-- 添加页面模态框 -->
    <div id="add-page-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-xl p-6 w-full max-w-md shadow-2xl fade-in">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-dark">添加新页面</h3>
                <button id="close-modal" class="text-gray-500 hover:text-gray-700">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <form id="new-page-form" class="space-y-4">
                <div>
                    <label for="page-name" class="block text-gray-700 font-medium mb-2">页面名称</label>
                    <input type="text" id="page-name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="例如：项目介绍" required>
                </div>
                <div>
                    <label for="page-url" class="block text-gray-700 font-medium mb-2">页面URL</label>
                    <input type="text" id="page-url" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="例如：project.html" required>
                </div>
                <div>
                    <label for="page-desc" class="block text-gray-700 font-medium mb-2">页面描述（可选）</label>
                    <textarea id="page-desc" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="简单描述页面内容"></textarea>
                </div>
                <div>
                    <label for="page-icon" class="block text-gray-700 font-medium mb-2">选择图标</label>
                    <div class="grid grid-cols-6 gap-2">
                        <button type="button" class="icon-option p-3 border border-gray-200 rounded-lg hover:border-primary hover:bg-primary/5" data-icon="fa-file-text-o">
                            <i class="fa fa-file-text-o text-xl"></i>
                        </button>
                        <button type="button" class="icon-option p-3 border border-gray-200 rounded-lg hover:border-primary hover:bg-primary/5" data-icon="fa-image">
                            <i class="fa fa-image text-xl"></i>
                        </button>
                        <button type="button" class="icon-option p-3 border border-gray-200 rounded-lg hover:border-primary hover:bg-primary/5" data-icon="fa-bar-chart">
                            <i class="fa fa-bar-chart text-xl"></i>
                        </button>
                        <button type="button" class="icon-option p-3 border border-gray-200 rounded-lg hover:border-primary hover:bg-primary/5" data-icon="fa-list">
                            <i class="fa fa-list text-xl"></i>
                        </button>
                        <button type="button" class="icon-option p-3 border border-gray-200 rounded-lg hover:border-primary hover:bg-primary/5" data-icon="fa-link">
                            <i class="fa fa-link text-xl"></i>
                        </button>
                        <button type="button" class="icon-option p-3 border border-gray-200 rounded-lg hover:border-primary hover:bg-primary/5" data-icon="fa-question-circle">
                            <i class="fa fa-question-circle text-xl"></i>
                        </button>
                    </div>
                    <input type="hidden" id="page-icon" value="fa-file-text-o">
                </div>
                <button type="submit" class="w-full py-3 bg-primary text-white font-medium rounded-lg hover:bg-primary/90 transition-colors">
                    添加页面
                </button>
            </form>
        </div>
    </div>

    <script>
        // 页面数据 - 初始页面列表
        let pages = [
            {
                name: "首页",
                url: "index.html",
                description: "网站首页，汇总所有页面的导航",
                icon: "fa-home",
                color: "#3B82F6" // primary
            },
            {
                name: "项目文档",
                url: "docs.html",
                description: "项目相关文档和说明",
                icon: "fa-file-text-o",
                color: "#10B981" // secondary
            },
            {
                name: "图片资源",
                url: "images.html",
                description: "项目所需的图片资源库",
                icon: "fa-image",
                color: "#8B5CF6" // accent
            },
            {
                name: "数据报表",
                url: "data.html",
                description: "项目相关的数据和报表",
                icon: "fa-bar-chart",
                color: "#F59E0B" // amber
            },
            {
                name: "任务清单",
                url: "tasks.html",
                description: "待完成和已完成的任务列表",
                icon: "fa-list",
                color: "#EF4444" // red
            },
            {
                name: "外部链接",
                url: "links.html",
                description: "相关的外部资源链接集合",
                icon: "fa-link",
                color: "#06B6D4" // cyan
            }
        ];

        // DOM元素
        const pagesContainer = document.getElementById('pages-container');
        const addPageBtn = document.getElementById('add-page-btn');
        const addPageModal = document.getElementById('add-page-modal');
        const closeModalBtn = document.getElementById('close-modal');
        const newPageForm = document.getElementById('new-page-form');
        const iconOptions = document.querySelectorAll('.icon-option');
        const pageIconInput = document.getElementById('page-icon');
        const refreshBtn = document.getElementById('refresh-btn');

        // 渲染页面卡片
        function renderPageCards() {
            pagesContainer.innerHTML = '';
            
            pages.forEach((page, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-md overflow-hidden card-hover fade-in relative';
                card.style.animationDelay = `${index * 100}ms`;
                
                card.innerHTML = `
                    <div class="p-6">
                        <div class="w-12 h-12 rounded-lg flex items-center justify-center mb-4" style="background-color: ${page.color}20;">
                            <i class="fa ${page.icon} text-xl" style="color: ${page.color};"></i>
                        </div>
                        <h3 class="text-xl font-bold text-dark mb-2">${page.name}</h3>
                        <p class="text-gray-600 text-sm mb-4">${page.description}</p>
                        <a href="${page.url}" class="inline-flex items-center text-white px-4 py-2 rounded-lg transition-colors" style="background-color: ${page.color};">
                            访问页面 <i class="fa fa-arrow-right ml-2"></i>
                        </a>
                        <button class="delete-btn absolute top-3 right-3 text-gray-400 hover:text-red-500 p-1" data-index="${index}">
                            <i class="fa fa-trash"></i>
                        </button>
                    </div>
                `;
                
                // 添加删除功能
                card.querySelector('.delete-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const index = parseInt(e.currentTarget.getAttribute('data-index'));
                    if (confirm(`确定要删除"${pages[index].name}"吗？`)) {
                        pages.splice(index, 1);
                        renderPageCards();
                        savePagesToLocalStorage();
                    }
                });
                
                pagesContainer.appendChild(card);
            });
        }

        // 打开模态框
        function openModal() {
            addPageModal.classList.remove('hidden');
            // 重置表单
            newPageForm.reset();
            pageIconInput.value = "fa-file-text-o";
            // 重置图标选择
            iconOptions.forEach(option => {
                option.classList.remove('border-primary', 'bg-primary/5');
            });
            iconOptions[0].classList.add('border-primary', 'bg-primary/5');
        }

        // 关闭模态框
        function closeModal() {
            addPageModal.classList.add('hidden');
        }

        // 保存页面数据到本地存储
        function savePagesToLocalStorage() {
            localStorage.setItem('sitePages', JSON.stringify(pages));
        }

        // 从本地存储加载页面数据
        function loadPagesFromLocalStorage() {
            const savedPages = localStorage.getItem('sitePages');
            if (savedPages) {
                pages = JSON.parse(savedPages);
                return true;
            }
            return false;
        }

        // 随机生成颜色
        function getRandomColor() {
            const colors = [
                "#3B82F6", "#10B981", "#8B5CF6", "#F59E0B", 
                "#EF4444", "#06B6D4", "#EC4899", "#6B7280"
            ];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // 事件监听
        // 页面加载时渲染卡片
        document.addEventListener('DOMContentLoaded', () => {
            // 尝试从本地存储加载页面数据
            const loaded = loadPagesFromLocalStorage();
            // 如果没有本地存储数据，则使用初始数据并保存
            if (!loaded) {
                savePagesToLocalStorage();
            }
            renderPageCards();
        });

        // 添加页面按钮点击
        addPageBtn.addEventListener('click', openModal);

        // 关闭模态框按钮点击
        closeModalBtn.addEventListener('click', closeModal);

        // 点击模态框外部关闭
        addPageModal.addEventListener('click', (e) => {
            if (e.target === addPageModal) {
                closeModal();
            }
        });

        // 图标选择
        iconOptions.forEach(option => {
            option.addEventListener('click', (e) => {
                e.preventDefault();
                // 移除所有选中状态
                iconOptions.forEach(opt => opt.classList.remove('border-primary', 'bg-primary/5'));
                // 添加当前选中状态
                option.classList.add('border-primary', 'bg-primary/5');
                // 设置隐藏字段值
                pageIconInput.value = option.getAttribute('data-icon');
            });
        });

        // 表单提交 - 添加新页面
        newPageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newPage = {
                name: document.getElementById('page-name').value,
                url: document.getElementById('page-url').value,
                description: document.getElementById('page-desc').value || '无描述',
                icon: pageIconInput.value,
                color: getRandomColor()
            };
            
            // 添加到页面列表
            pages.push(newPage);
            // 重新渲染
            renderPageCards();
            // 保存到本地存储
            savePagesToLocalStorage();
            // 关闭模态框
            closeModal();
        });

        // 刷新按钮
        refreshBtn.addEventListener('click', () => {
            pagesContainer.classList.add('opacity-0');
            setTimeout(() => {
                renderPageCards();
                pagesContainer.classList.remove('opacity-0');
            }, 300);
        });

        // 为卡片添加动画效果
        pagesContainer.style.transition = 'opacity 0.3s ease';
    </script>
</body>
</html>
