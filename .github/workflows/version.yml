name: Generate Version and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Increment version
        id: increment
        run: |
          if [ -f version.txt ]; then
            version=$(cat version.txt | grep -oP '^\d+\.\d+\.\d+')
          else
            version="0.0.0"
          fi
          IFS='.' read -r -a parts <<< "$version"
          parts[2]=$((parts[2] + 1))
          new_version="${parts[0]}.${parts[1]}.${parts[2]}"
          date=$(date +'%Y-%m-%d')
          echo "$new_version ($date)" > version.txt
          echo "::set-output name=new_version::$new_version"
          echo "::set-output name=date::$date"

      - name: Commit version file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add version.txt
          git commit -m 'Increment version to ${{ steps.increment.outputs.new_version }} on ${{ steps.increment.outputs.date }}'
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/streesobrs/StreePortal.git HEAD:main

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact to GitHub Actions
        uses: actions/upload-artifact@v3
        with:
          name: build-artifact
          path: dist

      - name: Upload artifact for pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: dist

      - name: Deploy
        uses: actions/deploy-pages@v3    
