name: Generate Version and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 防止版本提交触发新工作流
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4 
        with:
          name: build-output
          path: dist/

      - name: Increment version
        id: increment
        run: |
          if [ -f version.txt ]; then
            version=$(awk -F'[ .()]' '{print $1"."$2"."$3}' version.txt)
          else
            version="0.0.0"
          fi
          
          IFS='.' read -r -a parts <<< "$version"
          parts[2]=$((parts[2] + 1))
          new_version="${parts[0]}.${parts[1]}.${parts[2]}"
          date=$(date +'%Y-%m-%d')
          
          echo "$new_version ($date)" > version.txt
          echo "new_version=$new_version" >> $GITHUB_OUTPUT
          echo "date=$date" >> $GITHUB_OUTPUT

      - name: Commit version file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add version.txt
          git commit -m '[skip ci] Increment version to ${{ steps.increment.outputs.new_version }}'
          git push origin HEAD:main

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.increment.outputs.new_version }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
