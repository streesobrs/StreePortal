<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="StreePortal - 页面走丢了">
    <meta name="theme-color" content="#3B82F6">
    <title>404 - 页面走丢了 | StreePortal</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        accent: '#8B5CF6',
                        dark: '#1F2937',
                        light: '#F3F4F6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        }

        .dark .gradient-bg {
            background: linear-gradient(135deg, #1e3a8a 0%, #4c1d95 50%, #831843 100%);
        }

        .error-code {
            background: linear-gradient(135deg, #ffffff 0%, rgba(255, 255, 255, 0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
        }

        .dark .error-code {
            background: linear-gradient(135deg, #e0e7ff 0%, rgba(167, 139, 250, 0.8) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .btn-glow {
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-glow:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.6);
        }

        .dark .btn-glow {
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .dark .btn-glow:hover {
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.7);
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
        }

        .fade-in-delay-1 { animation-delay: 0.2s; }
        .fade-in-delay-2 { animation-delay: 0.4s; }
        .fade-in-delay-3 { animation-delay: 0.6s; }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .dark .glass-card {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="gradient-bg min-h-screen flex items-center justify-center font-sans">

    <div class="glass-card fade-in rounded-3xl p-8 md:p-16 max-w-2xl mx-4 text-center shadow-2xl">

        <div class="fade-in fade-in-delay-1">
            <i class="fa fa-search-minus text-5xl md:text-6xl text-white/80 float mb-6" aria-hidden="true"></i>
        </div>

        <h1 class="error-code fade-in fade-in-delay-2 text-[10rem] md:text-[14rem] font-black leading-none tracking-tight">
            404
        </h1>

        <h2 class="fade-in fade-in-delay-2 text-2xl md:text-3xl font-bold text-white mt-2 mb-3">
            页面走丢了
        </h2>

        <p class="fade-in fade-in-delay-2 text-base md:text-lg text-white/80 mb-8 leading-relaxed">
            抱歉，您访问的页面不存在，或者已经被移动到了其他地方。<br>
            让我们带您回到熟悉的地方吧。
        </p>

        <div class="fade-in fade-in-delay-3 flex flex-col sm:flex-row gap-4 justify-center items-center">
            <a href="index.html" id="homeBtn"
                class="btn-glow inline-flex items-center gap-2 bg-primary hover:bg-blue-600 text-white font-semibold px-8 py-4 rounded-full text-lg no-underline">
                <i class="fa fa-home" aria-hidden="true"></i>
                <span>返回主页</span>
            </a>
            <button id="backBtn"
                class="inline-flex items-center gap-2 bg-white/20 hover:bg-white/30 text-white font-semibold px-8 py-4 rounded-full text-lg no-underline transition-all duration-300 hover:-translate-y-1">
                <i class="fa fa-arrow-left" aria-hidden="true"></i>
                <span>返回上一页</span>
            </button>
        </div>

    </div>

    <script>
        (function () {
            if (localStorage.getItem('theme') === 'dark' ||
                (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }

            var homeBtn = document.getElementById('homeBtn');
            var backBtn = document.getElementById('backBtn');

            homeBtn.addEventListener('click', function (e) {
                e.preventDefault();
                homeBtn.style.transform = 'scale(0.95)';
                homeBtn.style.transition = 'transform 0.15s ease';
                setTimeout(function () {
                    window.location.href = 'index.html';
                }, 200);
            });

            homeBtn.addEventListener('mouseenter', function () {
                homeBtn.style.transform = 'translateY(-3px) scale(1.02)';
            });

            homeBtn.addEventListener('mouseleave', function () {
                homeBtn.style.transform = 'translateY(0) scale(1)';
            });

            backBtn.addEventListener('click', function () {
                if (window.history.length > 1) {
                    backBtn.style.transform = 'scale(0.95)';
                    backBtn.style.transition = 'transform 0.15s ease';
                    setTimeout(function () {
                        window.history.back();
                    }, 150);
                } else {
                    window.location.href = 'index.html';
                }
            });
        })();
    </script>

</body>

</html>
