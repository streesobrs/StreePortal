<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码生成器</title>
    <meta name="description" content="安全密码生成器 - 自定义长度和字符类型，生成强随机密码">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        accent: '#8B5CF6',
                        danger: '#EF4444',
                        dark: '#1F2937',
                        light: '#F3F4F6'
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                },
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .password-strength-weak {
                @apply bg-danger;
            }
            .password-strength-medium {
                @apply bg-yellow-500;
            }
            .password-strength-strong {
                @apply bg-secondary;
            }
        }
    </style>
    <style>
        /* 深色模式支持 */
        .dark body {
            background-color: rgb(17 24 39);
            color: rgb(243 244 246);
        }

        .dark .bg-white {
            background-color: rgb(31 41 55);
        }

        .dark .bg-gray-50 {
            background-color: rgb(31 41 55);
        }

        .dark .text-dark {
            color: rgb(243 244 246);
        }

        .dark .text-gray-600 {
            color: rgb(209 213 219);
        }

        .dark .text-gray-500 {
            color: rgb(156 163 175);
        }

        .dark .border-gray-200 {
            border-color: rgb(55 65 81);
        }

        .dark .bg-gray-200 {
            background-color: rgb(55 65 81);
        }

        .dark .hover:bg-gray-200:hover {
            background-color: rgb(65 75 92);
        }
    </style>
</head>

<body class="font-inter bg-gray-50 text-dark min-h-screen flex flex-col">
    <!-- 主容器 -->
    <div class="flex-1 flex flex-col max-w-2xl w-full mx-auto px-4 py-8">
        <!-- 返回主页按钮 -->
        <div class="flex justify-start mb-4">
            <a href="../index.html" target="_top"
                class="inline-flex items-center gap-2 px-4 py-2 text-gray-600 hover:text-primary hover:bg-primary/10 rounded-lg transition-colors">
                <i class="fa fa-arrow-left"></i>
                <span>返回主页</span>
            </a>
        </div>

        <!-- 标题区域 -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-primary mb-2">密码生成器</h1>
            <p class="text-gray-600">生成安全的随机密码</p>
        </div>

        <!-- 密码生成器主体 -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden player-shadow">
            <!-- 密码显示区域 -->
            <div class="p-6 border-b border-gray-200">
                <div class="flex items-center justify-between mb-4">
                    <label class="text-sm font-medium text-gray-600 dark:text-gray-400">生成的密码</label>
                    <span id="password-strength-indicator" class="text-xs font-medium px-2 py-1 rounded-full">
                        强度: <span id="password-strength">弱</span>
                    </span>
                </div>
                <div class="flex items-center gap-3">
                    <input type="text" id="generated-password" readonly
                        class="flex-1 px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                    <button id="copy-password"
                        class="px-4 py-3 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors flex items-center gap-2">
                        <i class="fa fa-copy"></i>
                        <span>复制</span>
                    </button>
                </div>
                <div id="copy-message" class="mt-2 text-sm text-secondary hidden">
                    <i class="fa fa-check-circle"></i> 密码已复制到剪贴板
                </div>
            </div>

            <!-- 选项设置 -->
            <div class="p-6">
                <!-- 密码长度 -->
                <div class="mb-6">
                    <div class="flex items-center justify-between mb-2">
                        <label class="text-sm font-medium text-gray-600 dark:text-gray-400">密码长度</label>
                        <span id="password-length-value" class="text-sm font-medium">16</span>
                    </div>
                    <input type="range" id="password-length" min="8" max="32" value="16"
                        class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary dark:bg-gray-700">
                </div>

                <!-- 字符类型 -->
                <div class="space-y-3 mb-6">
                    <h3 class="text-sm font-medium text-gray-600 dark:text-gray-400">包含字符类型</h3>

                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="include-uppercase" checked
                            class="w-4 h-4 text-primary focus:ring-primary border-gray-300 rounded dark:bg-gray-700 dark:border-gray-600 dark:checked:bg-primary">
                        <label for="include-uppercase" class="text-sm text-gray-600 dark:text-gray-400">大写字母
                            (A-Z)</label>
                    </div>

                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="include-lowercase" checked
                            class="w-4 h-4 text-primary focus:ring-primary border-gray-300 rounded dark:bg-gray-700 dark:border-gray-600 dark:checked:bg-primary">
                        <label for="include-lowercase" class="text-sm text-gray-600 dark:text-gray-400">小写字母
                            (a-z)</label>
                    </div>

                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="include-numbers" checked
                            class="w-4 h-4 text-primary focus:ring-primary border-gray-300 rounded dark:bg-gray-700 dark:border-gray-600 dark:checked:bg-primary">
                        <label for="include-numbers" class="text-sm text-gray-600 dark:text-gray-400">数字 (0-9)</label>
                    </div>

                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="include-symbols" checked
                            class="w-4 h-4 text-primary focus:ring-primary border-gray-300 rounded dark:bg-gray-700 dark:border-gray-600 dark:checked:bg-primary">
                        <label for="include-symbols" class="text-sm text-gray-600 dark:text-gray-400">特殊字符
                            (!@#$%^&*)</label>
                    </div>
                </div>

                <!-- 生成按钮 -->
                <button id="generate-password"
                    class="w-full py-3 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors flex items-center justify-center gap-2 text-lg font-medium">
                    <i class="fa fa-refresh"></i>
                    <span>生成密码</span>
                </button>
            </div>
        </div>

        <!-- 功能说明 -->
        <div class="mt-8 text-center text-sm text-gray-600 dark:text-gray-400">
            <p>选择密码长度和包含的字符类型，点击生成按钮创建安全的随机密码</p>
            <p class="mt-1">生成的密码不会被存储，仅在本地生成</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM元素
            const elements = {
                generatedPassword: document.getElementById('generated-password'),
                copyPassword: document.getElementById('copy-password'),
                copyMessage: document.getElementById('copy-message'),
                generatePassword: document.getElementById('generate-password'),
                passwordLength: document.getElementById('password-length'),
                passwordLengthValue: document.getElementById('password-length-value'),
                includeUppercase: document.getElementById('include-uppercase'),
                includeLowercase: document.getElementById('include-lowercase'),
                includeNumbers: document.getElementById('include-numbers'),
                includeSymbols: document.getElementById('include-symbols'),
                passwordStrength: document.getElementById('password-strength'),
                passwordStrengthIndicator: document.getElementById('password-strength-indicator')
            };

            // 字符集
            const charSets = {
                uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
                lowercase: 'abcdefghijklmnopqrstuvwxyz',
                numbers: '0123456789',
                symbols: '!@#$%^&*()_+[]{}|;:,.<>?'
            };

            // 初始化
            function init() {
                // 生成初始密码
                generatePassword();

                // 绑定事件
                elements.generatePassword.addEventListener('click', generatePassword);
                elements.copyPassword.addEventListener('click', copyPassword);
                elements.passwordLength.addEventListener('input', (e) => {
                    elements.passwordLengthValue.textContent = e.target.value;
                    generatePassword();
                });

                // 字符类型复选框事件
                [elements.includeUppercase, elements.includeLowercase, elements.includeNumbers, elements.includeSymbols]
                    .forEach(checkbox => {
                        checkbox.addEventListener('change', generatePassword);
                    });
            }

            // 生成密码
            function generatePassword() {
                const length = parseInt(elements.passwordLength.value);
                const useUppercase = elements.includeUppercase.checked;
                const useLowercase = elements.includeLowercase.checked;
                const useNumbers = elements.includeNumbers.checked;
                const useSymbols = elements.includeSymbols.checked;

                // 构建字符集
                let charSet = '';
                if (useUppercase) charSet += charSets.uppercase;
                if (useLowercase) charSet += charSets.lowercase;
                if (useNumbers) charSet += charSets.numbers;
                if (useSymbols) charSet += charSets.symbols;

                // 确保至少选择了一种字符类型
                if (charSet.length === 0) {
                    // 默认使用所有字符类型
                    charSet = charSets.uppercase + charSets.lowercase + charSets.numbers + charSets.symbols;
                    elements.includeUppercase.checked = true;
                    elements.includeLowercase.checked = true;
                    elements.includeNumbers.checked = true;
                    elements.includeSymbols.checked = true;
                }

                // 生成密码
                let password = '';
                for (let i = 0; i < length; i++) {
                    const randomIndex = Math.floor(Math.random() * charSet.length);
                    password += charSet[randomIndex];
                }

                // 更新显示
                elements.generatedPassword.value = password;

                // 评估密码强度
                evaluatePasswordStrength(password);
            }

            // 评估密码强度
            function evaluatePasswordStrength(password) {
                let strength = 0;

                // 长度评估
                if (password.length >= 12) strength += 1;
                if (password.length >= 16) strength += 1;

                // 字符类型评估
                if (/[A-Z]/.test(password)) strength += 1;
                if (/[a-z]/.test(password)) strength += 1;
                if (/[0-9]/.test(password)) strength += 1;
                if (/[^A-Za-z0-9]/.test(password)) strength += 1;

                // 更新强度显示
                let strengthText, strengthClass;
                if (strength <= 2) {
                    strengthText = '弱';
                    strengthClass = 'password-strength-weak';
                } else if (strength <= 4) {
                    strengthText = '中等';
                    strengthClass = 'password-strength-medium';
                } else {
                    strengthText = '强';
                    strengthClass = 'password-strength-strong';
                }

                elements.passwordStrength.textContent = strengthText;
                elements.passwordStrengthIndicator.className = 'text-xs font-medium px-2 py-1 rounded-full';
                elements.passwordStrengthIndicator.classList.add(strengthClass);
            }

            // 复制密码到剪贴板
            function copyPassword() {
                const password = elements.generatedPassword.value;

                if (password) {
                    navigator.clipboard.writeText(password)
                        .then(() => {
                            // 显示复制成功消息
                            elements.copyMessage.classList.remove('hidden');
                            setTimeout(() => {
                                elements.copyMessage.classList.add('hidden');
                            }, 2000);
                        })
                        .catch(err => {
                            console.error('复制失败:', err);
                        });
                }
            }

            // 初始化应用
            init();
        });
    </script>
</body>

</html>
